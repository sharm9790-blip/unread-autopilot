name: produce-daily-shorts
# The daily routine pushes daily/<date>/ to claude/daily-shorts -> voice, render, upload, Telegram report.
# 08:00 IST: high-level daily stats to Telegram (+ live pulse at 12/16/20/00 IST), and a warning if no stories were written today.
on:
  push:
    branches: [claude/daily-shorts]
    paths: ["daily/*/day.json"]
  workflow_dispatch:
    inputs:
      day:
        description: "daily folder date (YYYY-MM-DD); empty = newest without results; \"instagram\" = Instagram cross-post now; \"compilation\" = build the weekly compilation now"
        required: false
  schedule:
    - cron: "30 2 * * *"            # 08:00 IST daily stats
    - cron: "30 6,10,14,18 * * *"   # 12:00 / 16:00 / 20:00 / 00:00 IST live pulse
    - cron: "45 23 * * *"           # 05:15 IST: cross-post yesterday's YouTube Shorts to Instagram
    - cron: "30 4 * * 0"            # Sunday 10:00 IST: weekly long compilation of the best Shorts (public 20:30 IST)

concurrency: { group: produce, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  produce:
    if: github.event_name != 'schedule' && github.event.inputs.day != 'instagram' && github.event.inputs.day != 'compilation'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/daily-shorts }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          pip install -q pillow numpy requests certifi google-api-python-client google-auth-oauthlib
          # free photo parallax (pipeline/parallax.py): CPU torch + Depth Anything V2 Small + fast remap
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q opencv-python-headless "transformers>=4.45,<5"
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-depth-anything-v2-small }
      - name: YouTube credentials
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/scary-short && umask 077
          printf '%s' "$YT_CLIENT_SECRET_JSON" > ~/.config/scary-short/client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/scary-short/youtube_token.json
      - name: Pick the day
        id: day
        run: |
          D="${{ github.event.inputs.day }}"
          if [ -z "$D" ]; then
            D=$(for f in $(ls -d daily/*/ | sort -r); do [ -f "$f/day.json" ] && [ ! -f "$f/results.json" ] && basename "$f" && break; done)
          fi
          echo "day=$D" >> "$GITHUB_OUTPUT"; echo "Producing: $D"
      - name: Produce + upload
        if: steps.day.outputs.day != ''
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}          # paid AI stills + hero clips (pipeline/falgen.py); optional
          FAL_DAILY_CAP: "0.64"                    # hard USD cap per IST day (~$19/month max)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}            # stash an Instagram copy in the ig-queue release
        run: python3 pipeline/produce.py daily/${{ steps.day.outputs.day }}
      - name: Save results
        if: always() && steps.day.outputs.day != ''
        run: |
          git config user.name "unread-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add -A daily stories_index.json state branding
          git commit -m "produced ${{ steps.day.outputs.day }}" || exit 0
          git pull --rebase -q origin claude/daily-shorts && git push -q origin HEAD:claude/daily-shorts
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.day.outputs.day }}
          path: daily/${{ steps.day.outputs.day }}/*/produce.log
          retention-days: 14

  morning-check:
    if: github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/daily-shorts }
      - name: Daily stats (high level)
        continue-on-error: true
        env:
          YT_ANALYTICS_TOKEN_JSON: ${{ secrets.YT_ANALYTICS_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}   # credits left line (needs User -> Read on the key)
        run: |
          pip install -q google-api-python-client google-auth
          mkdir -p ~/.config/scary-short && umask 077
          printf '%s' "$YT_ANALYTICS_TOKEN_JSON" > ~/.config/scary-short/analytics_token.json
          python3 pipeline/daily_stats.py
          python3 pipeline/daily_stats.py --renewals || true   # ElevenLabs / Claude / fal.ai: alert the day before
          # top/bottom Shorts by live views -> state/winners.json, read by tomorrow's 06:00 writer (double down on winners)
          python3 pipeline/viral_scan.py || true   # other channels' viral scary Shorts (14 days) -> state/viral.json
          [ -n "$APIFY_TOKEN" ] && python3 pipeline/social_scan.py || true   # TikTok + Instagram viral (Apify, ~$0.11/day)
          python3 pipeline/daily_stats.py --winners && {
            git config user.name "unread-autopilot" && git config user.email "actions@users.noreply.github.com"
            git add state/winners.json state/viral.json state/social_viral.json && git commit -q -m "winners + viral $(TZ=Asia/Kolkata date +%F)" &&
            git pull -q --rebase origin claude/daily-shorts && git push -q origin HEAD:claude/daily-shorts; } || true
      - name: Were today's stories written?
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          D=$(TZ=Asia/Kolkata date +%F)
          if [ ! -f "daily/$D/day.json" ]; then
            curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
              --data-urlencode "text=⚠️ <b>UNREAD · $D</b>
          No stories were written this morning, so nothing is scheduled today.
          Check the daily-shorts routine on claude.ai/code." > /dev/null
          fi

  pulse:
    if: github.event.schedule == '30 6,10,14,18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/daily-shorts }
      - uses: actions/cache/restore@v4
        with: { path: ~/.cache/unread-pulse.json, key: "pulse-${{ github.run_id }}", restore-keys: "pulse-" }
      - name: Live pulse to Telegram
        env:
          YT_ANALYTICS_TOKEN_JSON: ${{ secrets.YT_ANALYTICS_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install -q google-api-python-client google-auth
          mkdir -p ~/.config/scary-short && umask 077
          printf '%s' "$YT_ANALYTICS_TOKEN_JSON" > ~/.config/scary-short/analytics_token.json
          python3 pipeline/daily_stats.py --pulse
      - uses: actions/cache/save@v4
        if: always()
        with: { path: ~/.cache/unread-pulse.json, key: "pulse-${{ github.run_id }}" }

  instagram:
    if: github.event.schedule == '45 23 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.day == 'instagram')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/daily-shorts }
      - name: Tools + YouTube credentials (to confirm each Short is public)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          pip install -q google-api-python-client google-auth-oauthlib
          mkdir -p ~/.config/scary-short && umask 077
          printf '%s' "$YT_CLIENT_SECRET_JSON" > ~/.config/scary-short/client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/scary-short/youtube_token.json
      - name: Post yesterday's Shorts as Reels
        env:
          IG_TOKEN_JSON: ${{ secrets.IG_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 pipeline/ig_daily.py post
      - name: Save Instagram state
        if: always()
        run: |
          git config user.name "unread-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state/ig_queue.json state/ig_posted.json 2>/dev/null || true
          git commit -m "instagram $(TZ=Asia/Kolkata date +%F)" || exit 0
          git pull --rebase -q origin claude/daily-shorts && git push -q origin HEAD:claude/daily-shorts

  compilation:
    if: github.event.schedule == '30 4 * * 0' || (github.event_name == 'workflow_dispatch' && github.event.inputs.day == 'compilation')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/daily-shorts }
      - name: Tools + YouTube credentials
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation > /dev/null
          pip install -q pillow google-api-python-client google-auth-oauthlib
          mkdir -p ~/.config/scary-short && umask 077
          printf '%s' "$YT_CLIENT_SECRET_JSON" > ~/.config/scary-short/client_secret.json
          printf '%s' "$YT_TOKEN_JSON" > ~/.config/scary-short/youtube_token.json
      - name: Build + schedule this week's compilation (20:30 IST)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          D=$(TZ=Asia/Kolkata date +%F)
          python3 pipeline/compile_week.py build --publish-at "${D}T20:30:00+05:30" | tee comp.log
          if [ -f "compilations/$D/uploaded.json" ]; then
            URL=$(python3 -c "import json;print(json.load(open('compilations/$D/uploaded.json'))['url'])")
            T=$(python3 -c "import json;print(json.load(open('compilations/$D/uploaded.json'))['title'])")
            curl -sS "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
              --data-urlencode "text=📼 <b>UNREAD weekly compilation</b>
          <a href=\"$URL\">$T</a>
          Goes public today at 20:30 IST." > /dev/null
          fi
      - name: Save compilation state
        if: always()
        run: |
          git config user.name "unread-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state/comp_queue.json state/compiled.json compilations/*/story.json compilations/*/uploaded.json compilations/*/order.json 2>/dev/null || true
          git commit -m "compilation $(TZ=Asia/Kolkata date +%F)" || exit 0
          git pull --rebase -q origin claude/daily-shorts && git push -q origin HEAD:claude/daily-shorts
